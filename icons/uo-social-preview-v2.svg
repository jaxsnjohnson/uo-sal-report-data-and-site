    <rect width="296" height="296" rx="64" fill="url(#tile)" stroke="#70B681" stroke-opacity=".3"/>
    <g transform="translate(18 18) scale(4.0625)">
      <ellipse cx="32" cy="32" rx="20" ry="23" fill="none" stroke="#FEE11A" stroke-width="8"/>
      <path d="M23 41V34h4v7zm7 0V28h4v13zm7 0V22h4v19z" fill="#FEE11A"/>
