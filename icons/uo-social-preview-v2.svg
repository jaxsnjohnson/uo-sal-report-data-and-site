<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">UO Salary Transparency</title>
  <desc id="description">Explore University of Oregon public salary records. Green and yellow UO-themed artwork with an O and salary chart icon.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#003B24"/><stop offset="1" stop-color="#007030"/>
    </linearGradient>
    <linearGradient id="tile" x2="1" y2="1">
      <stop stop-color="#00843D"/><stop offset="1" stop-color="#005328"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <path d="M875 0h325v630H710z" fill="#FFFFFF" opacity=".025"/>
  <circle cx="1105" cy="90" r="230" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".07"/>
  <circle cx="1105" cy="90" r="290" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".04"/>
  <rect width="12" height="630" fill="#FEE11A"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="72" y="112" fill="#FEE11A" font-size="23" font-weight="700" letter-spacing="3">UNIVERSITY OF OREGON</text>
    <text x="67" y="238" fill="#FFFFFF" font-size="76" font-weight="700" letter-spacing="-3">Salary</text>
    <text x="67" y="329" fill="#FFFFFF" font-size="76" font-weight="700" letter-spacing="-3">Transparency</text>
    <text x="72" y="397" fill="#D2E8D9" font-size="27">Explore public salary records.</text>
    <path d="M72 481h72" stroke="#FEE11A" stroke-width="4"/>
    <text x="72" y="538" fill="#D2E8D9" font-size="22">uo.oregonhigheredsalaries.org</text>
  </g>
  <g transform="translate(816 169)">
